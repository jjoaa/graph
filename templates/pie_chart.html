<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ year }}년 {{ ingredient }} 그래프</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>

    <!-- <h1>{{ year }}년 {{ ingredient }} 파이차트</h1> -->

    <div id="pie-chart"></div>

    <!-- 산점도 -->
    <div id="scatterDiv" style="width: 100%; height: 600px;"></div>

    
    <script>
        var year = "{{ year }}";
        var ingredient = "{{ ingredient }}";
         // 파이차트 
        fetch(`/get_pie_data?year=${year}&ingredient=${ingredient}`)
            .then(response => response.json())
            .then(data => {
                //console.log('파이차트 데이터:', data);
                var labels = data.labels;
                var values = data.values;

                var trace = {
                    labels: labels,
                    values: values,
                    type: 'pie',
                    hole: 0.3,
                    labeldistance : 1.2 
                };

                var layout = {
                    title: `${year}년 ${ingredient}`
                };

                Plotly.newPlot('pie-chart', [trace], layout);
               
            })
            .catch(error => {
                console.error('Error loading data for pie chart:', error);
            });


       
    // 산점도 데이터 요청
    fetch(`/get_scatter_data?year=${year}&category=${ingredient}`)
    .then(response => response.json())
    .then(data => {
        //console.log('산점도 데이터:', data);

    // 데이터 확인
    if (data[0] && data[0].x && data[0].y && data[0].text) {
        const xValues= data[0].x;
        const yValues = data[0].y;
        const textValues = data[0].text;

        // 산점도 데이터 설정
        const scatterData = {
        x: xValues,
        y: yValues,
        text: textValues,
        mode: 'markers', // 산점도 모드
        type: 'scatter',
        marker: {
            size: 14, // 점 크기 설정
            color: xValues, // x값에 따라 색상 설정
            colorscale: 'Viridis', // 색상 스케일 설정
            showscale: true, // 색상 스케일 표시
            colorbar: { title: '1인당 평균 처방량' } // 색상 스케일 제목
        },
        hoverinfo: 'text' // hover 시 표시할 정보 설정
        };

        // 레이아웃 설정
        const layout = {
        title: '약물 처방량과 환자 수 산점도',
        xaxis: { title: '환자 수' },
        yaxis: { title: '처방량' },
        showlegend: false // 범례 숨기기
        };

        // 산점도 그리기
        Plotly.newPlot('scatterDiv', [scatterData], layout);



    } else {
        console.error('산점도 데이터가 잘못되었습니다.');
    }

 
    })
    .catch(error => {
        console.error('Error loading data for scatter plot:', error);
    });

    </script>

</body>
</html>
